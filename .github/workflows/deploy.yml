name: Deploy Streamlit App to Azure

# Serialize deployments to avoid overlapping Azure OneDeploy operations.
concurrency:
  group: chat-bot-azure-production
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Verify dependencies and syntax on the runner. Do not deploy a venv
      # created on GitHub's runner; Azure must build its own Linux environment.
      - name: Install dependencies and validate Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q main.py streamlit_app.py

      - name: Build Python app for Azure App Service (Oryx)
        uses: azure/appservice-build@v3
        with:
          platform: python
          platform-version: "3.14"
          source-directory: .
          output-directory: ./build_output

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "Chat-Bot-Azure"
          publish-profile: ${{ secrets.CHAT_BOT }}
          package: ./build_output
